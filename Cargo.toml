[package]
# Modified for Ariember/fastctx: retain the CodeyX native file tool library.
name = "fastctx"
version = "0.2.6"
edition = "2024"
rust-version = "1.88"
description = "FastCtx — repository tools independently maintained for CodeyX."
authors = ["yc-duan <dy2958830371@gmail.com>", "fraternity-z"]
license = "Apache-2.0"
repository = "https://github.com/Ariember/fastctx"
readme = "README.md"
documentation = "https://github.com/Ariember/fastctx#readme"
keywords = ["codex", "codeyx", "ripgrep", "filesystem"]
categories = ["development-tools"]
include = [
    "/src/**",
    "/tests/**",
    "/README.md",
    "/LICENSE-APACHE",
    "/NOTICE",
    "/THIRD_PARTY_LICENSES.md",
    "/THIRD_PARTY_LICENSES_RUST.md",
]

[dependencies]
base64 = "0.22.1"
bpe-openai = "0.3.0"
chardetng = "1.0.0"
dunce = "1.0.5"
encoding_rs = "0.8.35"
fs2 = "0.4.3"
globset = "0.4.18"
grep-matcher = "0.1.8"
grep-regex = "0.1.14"
grep-searcher = "0.1.16"
hex = "0.4.3"
ignore = "0.4.28"
parking_lot = "0.12.5"
rayon = "1.11.0"
regex = "1.12.2"
regex-syntax = "0.8.11"
rmcp = { version = "=2.2.0", features = ["transport-io"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
strsim = "0.11.1"
time = { version = "0.3.53", features = ["formatting", "macros"] }
tokio = { version = "1.48.0", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tempfile = "3.23.0"
url = "2.5.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading"] }

[dev-dependencies]
filetime = "0.2.26"
tiktoken-rs = "0.12.0"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
